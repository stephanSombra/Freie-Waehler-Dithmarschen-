<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freie Wähler – Dithmarschen</title>
  <meta name="description" content="Freie Wähler Kreisvereinigung Dithmarschen – unabhängig, regional und mittendrin.">
  <meta name="theme-color" content="#111111">

  <!-- Link-Vorschau (WhatsApp, Facebook, …): Domain und Bild anpassen, Bild ca. 1200 × 630 px -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="Freie Wähler – Dithmarschen">
  <meta property="og:description" content="Unsere Heimat. Unsere Zukunft. Zeit, gemeinsam nach vorn zu denken.">
  <meta property="og:url" content="https://www.example.de/">
  <meta property="og:image" content="https://www.example.de/og-bild.jpg">

  <!-- Platzhalter-Favicon, später durch das Logo ersetzen -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f56608'/%3E%3Ctext x='32' y='47' font-size='44' font-weight='900' text-anchor='middle' fill='%23111' font-family='Arial'%3EF%3C/text%3E%3C/svg%3E">

  <!-- Hero-Bild früh laden; am besten als WebP/AVIF, ca. 1920 px breit -->
  <link rel="preload" as="image" href="dithmarschen-hero.jpg" fetchpriority="high">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
    }

    a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh; /* nach 100vh, sonst greift svh nie */
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(
          90deg,
          rgba(5, 9, 15, 0.83) 0%,
          rgba(5, 9, 15, 0.58) 48%,
          rgba(5, 9, 15, 0.12) 100%
        ),
        linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.48),
          transparent 40%
        ),
        url("dithmarschen-hero.jpg") center center / cover no-repeat;
      border-right: 10px solid #f56608;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 25px 5.5%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: #fff;
    }

    /* Platzhalter. Logo morgen: <img class="brand-logo" src="logo-weiss.svg" alt="" height="58">
       statt .brand-mark, mit .brand-logo { height: 58px; width: auto; } */
    .brand-mark {
      width: 48px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #f56608;
      color: #111;
      font-size: 34px;
      font-weight: 900;
      transform: skewY(-5deg);
    }

    .brand-name,
    .brand-subtitle {
      display: block;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-subtitle {
      margin-top: 7px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .top-claim {
      text-align: right;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: 3px;
    }

    .hero-content {
      width: 100%;
      max-width: 1100px;
      margin: auto 0;
      padding: 65px 5.5%;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 38px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .eyebrow::before {
      content: "";
      display: block;
      width: 48px;
      height: 6px;
      flex-shrink: 0;
      background: #f56608;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 108px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.03em;
      overflow-wrap: break-word;
    }

    h1 span {
      display: block;
      color: #f56608;
      margin-top: 8px;
    }

    .hero-description {
      margin: 34px 0 0;
      font-size: clamp(17px, 2vw, 25px);
      line-height: 1.6;
    }

    .hero-description strong {
      display: block;
      font-size: 1.05em;
    }

    .hero-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: fit-content;
      min-width: 420px;
      margin-top: 54px;
      padding: 22px 28px;
      background: #f56608;
      color: #111; /* ca. 6:1 statt 3,1:1 bei Weiß */
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      transition: background 0.2s ease;
    }

    .hero-button:hover {
      background: #fff;
    }

    .button-arrow {
      font-size: 25px;
      letter-spacing: 0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 22px 5.5%;
      background: rgba(10, 10, 10, 0.76);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .footer-brand span {
      color: #f56608;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer a {
      padding-block: 8px;
      color: #fff;
      text-decoration: none;
    }

    .footer a:hover {
      color: #f56608;
    }

    @media (max-width: 700px) {
      .hero {
        border-right-width: 6px;
      }

      .topbar {
        padding: 20px 6%;
      }

      .brand {
        gap: 10px;
      }

      .brand-mark {
        width: 38px;
        height: 46px;
        font-size: 27px;
      }

      .brand-name {
        font-size: 16px;
      }

      .brand-subtitle {
        font-size: 12px;
        letter-spacing: 1px;
      }

      /* doppelt zum Subtitle und zur Überschrift, mobil entbehrlich */
      .top-claim {
        display: none;
      }

      .hero-content {
        padding: 45px 6%;
      }

      .eyebrow {
        gap: 12px;
        margin-bottom: 26px;
        font-size: 12px;
        letter-spacing: 2px;
      }

      .eyebrow::before {
        width: 30px;
        height: 4px;
      }

      /* "DITHMARSCHEN." ist ca. 8 em breit, 10 vw bleibt sicher innerhalb der Spalte */
      h1 {
        font-size: clamp(30px, 10vw, 68px);
      }

      .hero-description {
        margin-top: 24px;
        font-size: 17px;
      }

      .hero-button {
        width: 100%;
        min-width: 0;
        margin-top: 34px;
        padding: 19px 17px;
        font-size: 12px;
        letter-spacing: 1px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 14px 6%;
        font-size: 12px;
        letter-spacing: 1.3px;
      }

      .footer-links {
        gap: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">

    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Freie Wähler Dithmarschen – Startseite">
        <span class="brand-mark" aria-hidden="true">F</span>

        <span>
          <span class="brand-name">FREIE WÄHLER</span>
          <span class="brand-subtitle">KREISVEREINIGUNG DITHMARSCHEN</span>
        </span>
      </a>

      <div class="top-claim">
        UNABHÄNGIG.<br>
        REGIONAL. MITTENDRIN.
      </div>
    </header>

    <main class="hero-content">
      <div class="eyebrow">FÜR UNSERE REGION</div>

      <h1>
        DITHMARSCHEN.
        <span>MEHR ALS PLATT.</span>
      </h1>

      <p class="hero-description">
        <strong>Unsere Heimat. Unsere Zukunft.</strong>
        Zeit, gemeinsam nach vorn zu denken.
      </p>

      <a class="hero-button" href="site.html">
        <span>ENTDECKE DIE KREISVEREINIGUNG</span>
        <span class="button-arrow" aria-hidden="true">↗</span>
      </a>
    </main>

    <footer class="footer">
      <div class="footer-brand">
        <span>FREIE WÄHLER</span> / DITHMARSCHEN
      </div>

      <nav class="footer-links" aria-label="Rechtliche Informationen">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>

  </div>

</body>
</html>
